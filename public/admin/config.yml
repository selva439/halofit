# Decap CMS — the team edits content and uploads photos at thehalofit.com/admin.
# Sign-in is via GitHub; every save commits to main and Netlify redeploys (~1 min).
backend:
  name: github
  repo: selva439/halofit
  branch: main
  commit_messages:
    update: "Content: update {{slug}} via admin"
    uploadMedia: "Content: upload {{path}} via admin"
    deleteMedia: "Content: delete {{path}} via admin"

site_url: https://thehalofit.com
display_url: https://thehalofit.com
logo_url: /icon.svg

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: site
    label: Website
    editor: { preview: false }
    files:
      - name: content
        label: Gym website content
        file: src/content/site.json
        fields:
          - { name: name, label: Gym name, widget: hidden }
          - { name: domain, label: Domain, widget: hidden }
          - { name: tagline, label: Tagline (browser tab title), widget: string }
          - { name: description, label: Google search description, widget: text }

          - label: Gallery
            name: gallery
            widget: list
            hint: Gym photos shown in the gallery section. Drag to reorder.
            summary: "{{fields.caption}}"
            fields:
              - { name: image, label: Photo, widget: image }
              - { name: caption, label: Caption, widget: string, required: false }

          - label: Hero (top of page)
            name: hero
            widget: object
            fields:
              - { name: image, label: Background photo, widget: image, required: false, hint: "Wide landscape shot, at least 1920px wide" }
              - { name: eyebrow, label: Small text above headline, widget: string }
              - { name: headline, label: Headline lines, widget: list, field: { name: line, label: Line, widget: string } }
              - { name: sub, label: Intro text, widget: text }

          - label: Contact
            name: contact
            widget: object
            fields:
              - { name: phone, label: Phone, widget: string }
              - { name: whatsapp, label: "WhatsApp number (digits only, with 91)", widget: string, pattern: ["^[0-9]{10,15}$", "Digits only, e.g. 919876543210"] }
              - { name: email, label: Email, widget: string }
              - { name: address, label: Address, widget: text }
              - { name: mapsUrl, label: Google Maps link, widget: string }
              - { name: instagram, label: Instagram link, widget: string }

          - label: Opening hours
            name: hours
            widget: list
            summary: "{{fields.days}}: {{fields.time}}"
            fields:
              - { name: days, label: Days, widget: string }
              - { name: time, label: Time, widget: string }

          - label: Stats strip
            name: stats
            widget: list
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { name: value, label: Number, widget: string }
              - { name: label, label: Label, widget: string }

          - label: Programs
            name: programs
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Description, widget: text }
              - { name: image, label: Photo, widget: image, required: false }
              - name: icon
                label: Icon (used when there is no photo)
                widget: select
                options: [dumbbell, heart, bolt, user, scale, lotus]

          - label: About
            name: about
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Story, widget: text }
              - { name: image, label: Photo, widget: image, required: false, hint: "Portrait photo works best" }
              - label: Pillars
                name: pillars
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: body, label: Text, widget: text }

          - label: Why choose us
            name: whyUs
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Text, widget: text }

          - label: Membership plans
            name: plans
            widget: list
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { name: name, label: Plan name, widget: string }
              - { name: price, label: "Price (e.g. ₹1,500)", widget: string }
              - { name: period, label: "Period (e.g. / month)", widget: string }
              - { name: features, label: Features, widget: list, field: { name: feature, label: Feature, widget: string } }
              - { name: featured, label: Highlight as most popular, widget: boolean, default: false }

          - label: Testimonials
            name: testimonials
            widget: list
            hint: Real member reviews only. The section is hidden while this is empty.
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Member name, widget: string }
              - { name: quote, label: Review, widget: text }
              - { name: result, label: "Result (e.g. Lost 12 kg)", widget: string, required: false }

          - label: FAQ
            name: faqs
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { name: q, label: Question, widget: string }
              - { name: a, label: Answer, widget: text }
